databaseChangeLog:
  - changeSet:
      id: 1-create-records-table
      author: otus
      changes:
        - createTable:
            tableName: records
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: content
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: owner_username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_records_owner_username
            tableName: records
            columns:
              - column:
                  name: owner_username
