services:
  keycloak-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./k8s/manifests/keycloak-config/hw23-realm.json:/opt/keycloak/data/import/hw23-realm.json:ro
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  records-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: recordsdb
      POSTGRES_USER: ${RECORDS_DB_USER:-records}
      POSTGRES_PASSWORD: ${RECORDS_DB_PASSWORD:-change-me}
    volumes:
      - records_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECORDS_DB_USER:-records} -d recordsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  records-service:
    build:
      context: records-service
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://records-db:5432/recordsdb
      SPRING_DATASOURCE_USERNAME: ${RECORDS_DB_USER:-records}
      SPRING_DATASOURCE_PASSWORD: ${RECORDS_DB_PASSWORD:-change-me}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/hw23/protocol/openid-connect/certs
    depends_on:
      records-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  traefik:
    image: traefik:v3.2
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./k8s/manifests/traefik-config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./k8s/manifests/traefik-config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    ports:
      - "8080:80"
      - "8082:8080"
    depends_on:
      - keycloak
      - records-service

volumes:
  keycloak_db_data:
  records_db_data:
