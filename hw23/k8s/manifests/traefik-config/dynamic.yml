http:
  middlewares:
    auth-forward:
      forwardAuth:
        address: "http://auth-service:8080/api/auth/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-Username"

  routers:
    auth-public:
      # Registration and login are the only endpoints reachable without a token.
      rule: "Path(`/api/auth/register`) || Path(`/api/auth/login`)"
      entryPoints:
        - web
      service: auth-service
      priority: 20

    auth-protected:
      rule: "Path(`/api/auth/logout`)"
      entryPoints:
        - web
      service: auth-service
      middlewares:
        - auth-forward
      priority: 20

    users-protected:
      rule: "PathPrefix(`/api/users`)"
      entryPoints:
        - web
      service: auth-service
      middlewares:
        - auth-forward
      priority: 10

    records-protected:
      # Every business endpoint goes through the auth-service forwardAuth check.
      rule: "PathPrefix(`/api/records`)"
      entryPoints:
        - web
      service: records-service
      middlewares:
        - auth-forward
      priority: 10

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8080"

    records-service:
      loadBalancer:
        servers:
          - url: "http://records-service:8080"
