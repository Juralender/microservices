apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: records-db-data
  labels:
    app: records-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-db
  labels:
    app: records-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: records-db
  template:
    metadata:
      labels:
        app: records-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-trixie
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: recordsdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: records-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: records-db-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "recordsdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "recordsdb"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: records-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: records-db
  labels:
    app: records-db
spec:
  type: ClusterIP
  selector:
    app: records-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
