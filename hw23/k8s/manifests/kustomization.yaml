apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hw23

resources:
  - namespace.yaml
  - secrets.yaml
  - auth-db.yaml
  - records-db.yaml
  - auth-service.yaml
  - records-service.yaml
  - traefik.yaml

configMapGenerator:
  - name: traefik-static-config
    files:
      - traefik-config/traefik.yml
    options:
      labels:
        app: traefik
  - name: traefik-dynamic-config
    files:
      - traefik-config/dynamic.yml
    options:
      labels:
        app: traefik
