# Dev/test-only credentials for local minikube deployments via skaffold.
# Never reuse these values outside local testing.
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-credentials
  labels:
    app: auth-db
type: Opaque
stringData:
  username: auth
  password: auth-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: records-db-credentials
  labels:
    app: records-db
type: Opaque
stringData:
  username: records
  password: records-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-jwt-secret
  labels:
    app: auth-service
type: Opaque
stringData:
  secret: dev-only-jwt-signing-secret-please-change-me-32b
